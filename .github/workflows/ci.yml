name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests with coverage
        run: pytest --cov=tasktracker --cov-report=xml --cov-report=term -v

      # The suite used to share one tasks.json and quietly passed only on a
      # clean checkout. Running it twice proves it no longer carries state.
      - name: Re-run the suite to prove it is repeatable
        run: pytest -q

      - name: Fail if any test was skipped
        run: |
          if pytest -q 2>&1 | grep -qiE '[0-9]+ skipped'; then
            echo "Tests were skipped; the suite must run in full."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
